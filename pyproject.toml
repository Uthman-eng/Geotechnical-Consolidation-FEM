[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geotech-consolidation-fem"
version = "0.1.0"
description = "Finite element framework for modelling consolidation settlement in soils using FEniCSx (DOLFINx)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
